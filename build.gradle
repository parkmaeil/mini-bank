plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'                                    // 10.7절 테스트 커버리지
	id 'com.vaadin' version '25.3.4'  // 🔥 ext의 vaadinVersion과 동일
}

group = 'com.itscoding'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// ① plugins { ... } 블록 아래에 추가 — 사용할 Vaadin 버전을 한 곳에서 정한다
ext {
	set('vaadinVersion', "25.3.4")
}

configurations {
	mockitoAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'    // 14장 Spring Security
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'   // 17장 JWT
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'

	// 🔥 [신규 추가] JPA (Java 객체와 DB를 매핑해주는 기술)
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 🔥 [신규 추가] MySQL 서버와 통신하기 위한 드라이버
	runtimeOnly 'com.mysql:mysql-connector-j'   // 버전은 Spring Boot가 관리

	// ② 🔥 [신규 추가] Vaadin Flow + Spring Boot 통합 스타터
	implementation 'com.vaadin:vaadin-spring-boot-starter'

	// ② 🔥 [신규 추가] 개발 모드 전용 도구 — 배포용 Jar에는 포함되지 않는다
	developmentOnly 'com.vaadin:vaadin-dev'

	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'   // 14.9절 (@WebMvcTest에 보안 설정 포함)
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'   // 10.5절 @DataJpaTest
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'          // 10.6절 Testcontainers
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'

	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

// ③ 파일 맨 아래에 추가 — Vaadin 라이브러리들의 버전을 BOM으로 일괄 관리한다
dependencyManagement {
	imports {
		mavenBom "com.vaadin:vaadin-bom:${vaadinVersion}"
	}
}

// 10.7절 JaCoCo 보고서 (build/reports/jacoco/test/html/index.html)
jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
	}
}

jar {
	enabled = false
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport          // 테스트가 끝나면 보고서를 자동 생성
	jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}
