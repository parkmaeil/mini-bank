# 11.4·11.7절 앱 + MySQL 통합판 (비밀번호는 .env에서 읽는다 — .env.example 참고)
services:
  mysql:
    image: mysql:8.4.0
    container_name: minibank-mysql
    environment:
      TZ: Asia/Seoul                              # DB가 기록하는 시각(NOW())도 한국 시각으로
      MYSQL_DATABASE: minibank
      MYSQL_USER: minibank
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/minibank_prod
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"