# application-dev.properties
logging.level.root=INFO
logging.level.com.itscoding=DEBUG
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Entity를 분석해 테이블을 자동 생성/수정
spring.jpa.hibernate.ddl-auto=update
# Hibernate가 만든 실제 SQL을 콘솔에 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 5.8절 개발 중에는 ddl-auto=update가 스키마를 맞추므로 Flyway는 끈다
spring.flyway.enabled=false

# 14.5절 첫 관리자(admin) 비밀번호 — 개발용 기본값 (ADMIN_PASSWORD 환경 변수가 있으면 그 값을 쓴다)
minibank.staff.admin-password=${ADMIN_PASSWORD:admin1234!}