# application.properties (공통 설정)
spring.application.name=mini-bank
spring.profiles.active=dev
minibank.account.number-prefix=110
minibank.account.default-daily-limit=3000000

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minibank}
spring.datasource.username=${DB_USERNAME:minibank}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.data.web.pageable.serialization-mode=via_dto

# 17.3절 JWT 서명 키 — 32바이트 이상의 임의 문자열. 반드시 환경 변수로 주입(11.7절)
minibank.jwt.secret=${JWT_SECRET}